name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches: [dev]

env:
  IMAGE_NAME: dukerupert/rockabilly-roasting

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}:dev-${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USER }}
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            cd ${{ secrets.DEV_VPS_DEPLOY_PATH }}
            export DOCKER_IMAGE=${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
            docker compose pull
            docker compose down || true
            # The script has no `set -e` and its last line decides the step's
            # exit status, so a failed `up -d` must exit here or the cleanup
            # below would turn the run green.
            docker compose up -d || exit 1
            # Each build is tagged dev-<sha>, so stale dev images pile up tagged,
            # where a dangling-only prune never reaches them. Remove them by
            # name rather than with a host-wide `prune -a`: this VPS also runs
            # other sites, whose unused tagged images are not ours to delete.
            # An image still in use is refused by rmi, which is the point.
            docker images "${{ env.IMAGE_NAME }}" --format '{{.Repository}}:{{.Tag}}' \
              | grep ':dev-' | grep -v -x -F "$DOCKER_IMAGE" \
              | xargs -r docker rmi || true
