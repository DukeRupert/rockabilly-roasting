name: Deploy Prod

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  IMAGE_NAME: dukerupert/rockabilly-roasting

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            cd ${{ secrets.PROD_VPS_DEPLOY_PATH }}
            docker compose pull
            # The script has no `set -e` and its last line decides the step's
            # exit status, so a failed `up -d` must exit here or the cleanup
            # below would turn the run green.
            docker compose up -d || exit 1
            # Each deploy leaves the previous :latest behind as an untagged
            # (dangling) image. Rollback is a pull by tag from Docker Hub, so
            # those are just disk. Dangling-only on purpose: this VPS also runs
            # other sites, and `prune -a` would delete their unused tagged
            # images too (and postgres:17-alpine, which the restore test uses).
            docker image prune -f || true
