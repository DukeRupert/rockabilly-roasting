<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:0;display:flex;">
  <div style="flex:1;background:var(--paper);padding:18px 18px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;">
    <img src="../assets/badge-black.png" style="width:130px;height:130px;object-fit:contain;"/>
    <div style="font-family:var(--font-sans);font-weight:700;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;">2026 BADGE · BLACK</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--chrome-deep);">Light surfaces</div>
  </div>
  <div style="flex:1;background:var(--ink);padding:18px 18px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;">
    <img src="../assets/badge-white.png" style="width:130px;height:130px;object-fit:contain;"/>
    <div style="font-family:var(--font-sans);font-weight:700;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--paper);">2026 BADGE · WHITE</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--amber);">Dark surfaces</div>
  </div>
</div>
</body></html>
