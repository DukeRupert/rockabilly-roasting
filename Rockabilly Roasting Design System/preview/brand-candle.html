<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:20px;display:flex;gap:20px;align-items:center;background:var(--ink);">
  <div style="width:170px;height:210px;display:flex;align-items:center;justify-content:center;">
    <img src="../assets/double-candle.png" style="width:100%;height:100%;object-fit:contain;"/>
  </div>
  <div style="flex:1;">
    <div style="font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--amber);margin-bottom:8px;">Hero illustration — double candle</div>
    <div style="font-family:var(--font-display);font-size:26px;line-height:1;text-transform:uppercase;color:var(--paper);">BURN BOTH<br>ENDS</div>
    <p style="font-family:var(--font-sans);font-size:13px;color:var(--paper-warm);margin:8px 0 0;line-height:1.5;">The most expressive brand asset. Dark backgrounds only. Never recolor. Use at hero scale — not as an icon.</p>
  </div>
</div>
</body></html>
