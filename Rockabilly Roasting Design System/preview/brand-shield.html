<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:20px;display:flex;gap:20px;align-items:center;background:var(--paper);">
  <div style="width:150px;height:180px;display:flex;align-items:center;justify-content:center;">
    <img src="../assets/logo-shield.png" style="width:100%;height:100%;object-fit:contain;"/>
  </div>
  <div style="flex:1;">
    <div class="eyebrow-card">Primary mark — shield badge</div>
    <div style="font-family:var(--font-display);font-size:26px;line-height:1;text-transform:uppercase;">ROCKABILLY<br>ROASTING CO.</div>
    <p style="font-family:var(--font-sans);font-size:13px;color:var(--fg-2);margin:8px 0 0;line-height:1.5;">Use on paper / light surfaces. Min size 48px. Preserve clear-space equal to the height of the "CO." banner on all sides.</p>
  </div>
</div>
</body></html>
