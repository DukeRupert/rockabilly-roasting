<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">

    <div class="swatch" style="background:#F2A03D;color:#0E0D0C;"><span class="name">Amber</span><span class="hex">#F2A03D — var(--amber)</span></div>
    <div class="swatch" style="background:#B4351D;color:#F6EFE1;"><span class="name">Rust</span><span class="hex">#B4351D — var(--rust)</span></div>
  </div>
</div>
</body></html>
