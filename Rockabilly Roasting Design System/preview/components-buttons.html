<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .btn { font-family: var(--font-sans); font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; padding: 12px 22px; border: 2px solid var(--ink); border-radius: 2px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary { background: var(--rust); color: var(--paper); box-shadow: 4px 4px 0 0 var(--ink); }
  .btn-ghost   { background: transparent; color: var(--ink); box-shadow: 4px 4px 0 0 var(--ink); }
  .btn-amber   { background: var(--amber); color: var(--ink); box-shadow: 4px 4px 0 0 var(--ink); }
  .btn-ink     { background: var(--ink); color: var(--paper); box-shadow: 4px 4px 0 0 var(--amber-deep); }
</style>
</head><body>
<div class="card" style="padding:26px;">
  <div class="eyebrow-card">Buttons</div>
  <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center;">
    <button class="btn btn-primary">Shop the Roast</button>
    <button class="btn btn-ghost">Our Story</button>
    <button class="btn btn-amber">New · Limited</button>
    <button class="btn btn-ink">Order Online ›</button>
  </div>
</div>
</body></html>
