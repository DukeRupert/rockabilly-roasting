<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:20px 26px;background:var(--ink);">
  <div style="font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--amber);margin-bottom:10px;">Menu panel · dark</div>
  <div style="border:2px solid var(--paper);padding:14px 18px;position:relative;">
    <div style="position:absolute;inset:4px;border:1px solid var(--paper);pointer-events:none;opacity:0.4;"></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed rgba(246,239,225,0.3);">
      <span style="font-family:var(--font-sans);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.06em;color:var(--paper);">Drip Coffee</span>
      <span style="font-family:var(--font-mono);font-size:14px;color:var(--amber);">3.25</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed rgba(246,239,225,0.3);">
      <span style="font-family:var(--font-sans);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.06em;color:var(--paper);">Espresso · double</span>
      <span style="font-family:var(--font-mono);font-size:14px;color:var(--amber);">4.00</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed rgba(246,239,225,0.3);">
      <span style="font-family:var(--font-sans);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.06em;color:var(--paper);">Cortado</span>
      <span style="font-family:var(--font-mono);font-size:14px;color:var(--amber);">4.75</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;">
      <span style="font-family:var(--font-sans);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.06em;color:var(--paper);">Cold Brew · 16oz</span>
      <span style="font-family:var(--font-mono);font-size:14px;color:var(--amber);">5.50</span>
    </div>
  </div>
</div>
</body></html>
