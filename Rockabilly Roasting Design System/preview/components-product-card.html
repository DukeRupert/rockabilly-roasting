<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:24px 26px;">
  <div class="eyebrow-card">Product card</div>
  <div style="display:flex;gap:18px;">
    <div style="width:140px;height:160px;background:var(--paper-warm);border:2px solid var(--ink);box-shadow:4px 4px 0 0 var(--ink);display:flex;align-items:center;justify-content:center;">
      <img src="../assets/logo-shield.png" style="width:100px;opacity:0.88;"/>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;padding-right:6px;">
      <div style="font-family:var(--font-sans);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--chrome-deep);">DARK ROAST · SINGLE ORIGIN</div>
      <div style="font-family:var(--font-display);font-size:30px;line-height:0.95;text-transform:uppercase;margin-top:4px;">GREASY SPOON</div>
      <div style="font-family:var(--font-script);font-size:26px;color:var(--rust);line-height:1;margin-top:2px;">roasted fresh</div>
      <p style="font-family:var(--font-sans);font-size:13px;color:var(--fg-2);margin:10px 0 0;line-height:1.5;">Cocoa, cedar, a kick at the back. Dark enough to mean it.</p>
      <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:2px solid var(--ink);">
        <span style="font-family:var(--font-mono);font-size:16px;">$18.00</span>
        <span style="font-family:var(--font-sans);font-weight:700;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;background:var(--rust);color:var(--paper);padding:5px 10px;border:2px solid var(--ink);">ADD · 12OZ</span>
      </div>
    </div>
  </div>
</div>
</body></html>
