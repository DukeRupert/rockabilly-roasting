<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:24px 26px;">
  <div class="eyebrow-card">Interaction — stamp press</div>
  <div style="display:flex;gap:26px;align-items:center;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="font-family:var(--font-sans);font-weight:700;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;padding:11px 22px;border:2px solid var(--ink);border-radius:2px;background:var(--rust);color:var(--paper);box-shadow:4px 4px 0 0 var(--ink);">REST</div>
      <span style="font-family:var(--font-mono);font-size:10px;color:var(--chrome-deep);">translate(0,0) · 4px shadow</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="font-family:var(--font-sans);font-weight:700;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;padding:11px 22px;border:2px solid var(--ink);border-radius:2px;background:var(--rust);color:var(--paper);box-shadow:5px 5px 0 0 var(--ink);transform:translate(-1px,-1px);">HOVER</div>
      <span style="font-family:var(--font-mono);font-size:10px;color:var(--chrome-deep);">translate(-1,-1) · 5px</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="font-family:var(--font-sans);font-weight:700;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;padding:11px 22px;border:2px solid var(--ink);border-radius:2px;background:var(--rust-deep);color:var(--paper);box-shadow:0 0 0 0 var(--ink);transform:translate(2px,2px);">PRESS</div>
      <span style="font-family:var(--font-mono);font-size:10px;color:var(--chrome-deep);">translate(2,2) · shadow collapse</span>
    </div>
  </div>
</div>
</body></html>
