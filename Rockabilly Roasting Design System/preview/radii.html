<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:28px;">
  <div class="eyebrow-card">Corners — default square</div>
  <div style="display:flex;gap:20px;align-items:flex-start;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:100px;height:70px;background:var(--paper-warm);border:2px solid var(--ink);border-radius:0;"></div>
      <span style="font-family:var(--font-mono);font-size:11px;">0 · default</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:100px;height:70px;background:var(--paper-warm);border:2px solid var(--ink);border-radius:2px;"></div>
      <span style="font-family:var(--font-mono);font-size:11px;">2 · buttons</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:100px;height:70px;background:var(--paper-warm);border:2px solid var(--ink);border-radius:4px;"></div>
      <span style="font-family:var(--font-mono);font-size:11px;">4 · cards</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:140px;height:32px;background:var(--amber);border:2px solid var(--ink);border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;">SMALL BATCH</div>
      <span style="font-family:var(--font-mono);font-size:11px;">pill · 999</span>
    </div>
  </div>
</div>
</body></html>
