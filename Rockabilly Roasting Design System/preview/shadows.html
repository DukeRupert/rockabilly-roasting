<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:28px;">
  <div class="eyebrow-card">Shadows — stamp-press, not soft drops</div>
  <div style="display:flex;gap:24px;align-items:flex-start;padding:8px 0 14px;">
    <div style="width:120px;height:70px;background:var(--paper-warm);border:2px solid var(--ink);box-shadow:2px 2px 0 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">STAMP SM</div>
    <div style="width:120px;height:70px;background:var(--paper-warm);border:2px solid var(--ink);box-shadow:4px 4px 0 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">STAMP</div>
    <div style="width:120px;height:70px;background:var(--amber);border:2px solid var(--ink);box-shadow:4px 4px 0 0 var(--amber-deep);display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">STAMP AMBER</div>
    <div style="width:120px;height:70px;background:var(--cream-hi);border:1px solid var(--rule-soft);box-shadow:0 2px 10px rgba(14,13,12,0.10);display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--chrome-deep);">SOFT (UI only)</div>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--chrome-deep);border-top:2px solid var(--ink);padding-top:8px;">
    --shadow-stamp-sm · --shadow-stamp · --shadow-stamp-amber · --shadow-soft
  </div>
</div>
</body></html>
