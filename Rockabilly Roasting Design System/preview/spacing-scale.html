<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:22px 26px;">
  <div class="eyebrow-card">Spacing — 4px base</div>
  <div style="display:flex;align-items:flex-end;gap:10px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:4px;height:4px;background:var(--ink);"></div><span style="font-family:var(--font-mono);font-size:10px;">s-1<br>4</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:8px;height:8px;background:var(--ink);"></div><span style="font-family:var(--font-mono);font-size:10px;">s-2<br>8</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:12px;height:12px;background:var(--ink);"></div><span style="font-family:var(--font-mono);font-size:10px;">s-3<br>12</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:16px;height:16px;background:var(--ink);"></div><span style="font-family:var(--font-mono);font-size:10px;">s-4<br>16</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:24px;height:24px;background:var(--ink);"></div><span style="font-family:var(--font-mono);font-size:10px;">s-5<br>24</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:32px;height:32px;background:var(--ink);"></div><span style="font-family:var(--font-mono);font-size:10px;">s-6<br>32</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:48px;height:48px;background:var(--ink);"></div><span style="font-family:var(--font-mono);font-size:10px;">s-7<br>48</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:64px;height:64px;background:var(--ink);"></div><span style="font-family:var(--font-mono);font-size:10px;">s-8<br>64</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:96px;height:96px;background:var(--ink);"></div><span style="font-family:var(--font-mono);font-size:10px;">s-9<br>96</span></div>
  </div>
</div>
</body></html>
