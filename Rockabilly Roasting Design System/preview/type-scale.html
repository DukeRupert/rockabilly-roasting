<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:24px 26px;">
  <div class="eyebrow-card">Type scale</div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div style="display:flex;align-items:baseline;gap:14px;"><span style="font-family:var(--font-display);font-size:56px;line-height:1;text-transform:uppercase;">DISPLAY</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--chrome-deep);">88–140px</span></div>
    <div style="display:flex;align-items:baseline;gap:14px;"><span style="font-family:var(--font-heritage);font-size:38px;line-height:1;">Heritage H1</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--chrome-deep);">40–64px</span></div>
    <div style="display:flex;align-items:baseline;gap:14px;"><span style="font-family:var(--font-sans);font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:0.03em;">H2 — OSWALD</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--chrome-deep);">30–44px</span></div>
    <div style="display:flex;align-items:baseline;gap:14px;"><span style="font-family:var(--font-sans);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:0.04em;">H3 — OSWALD</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--chrome-deep);">24px</span></div>
    <div style="display:flex;align-items:baseline;gap:14px;"><span style="font-family:var(--font-sans);font-size:16px;">Body — 17px Oswald 400</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--chrome-deep);">17px / 1.6</span></div>
    <div style="display:flex;align-items:baseline;gap:14px;"><span style="font-family:var(--font-sans);font-size:11px;text-transform:uppercase;letter-spacing:0.2em;color:var(--fg-2);">EYEBROW · 13PX · 0.2EM</span></div>
  </div>
</div>
</body></html>
