<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:22px 26px;">
  <div class="eyebrow-card">Voice — do / don't</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
    <div style="border:2px solid var(--ink);padding:12px 14px;background:var(--paper-warm);box-shadow:4px 4px 0 0 var(--ink);">
      <div style="font-family:var(--font-sans);font-weight:700;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink);margin-bottom:6px;">✓ DO</div>
      <div style="font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--ink);">"Dark enough to mean it. Smooth enough to drink all day."</div>
    </div>
    <div style="border:2px solid var(--rust);padding:12px 14px;background:var(--paper);box-shadow:4px 4px 0 0 var(--rust);">
      <div style="font-family:var(--font-sans);font-weight:700;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--rust);margin-bottom:6px;">✗ DON'T</div>
      <div style="font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--fg-2);text-decoration:line-through;">"Discover our curated artisanal coffee journey ☕✨"</div>
    </div>
  </div>
</div>
</body></html>
