{{define "wholesale_approved.html"}}<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;padding:0;background-color:#F5F0E6;font-family:Arial,Helvetica,sans-serif;color:#1A1612;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F0E6;padding:24px 0;">
<tr><td align="center">
<table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
  <tr><td style="background-color:#1A1612;padding:24px;text-align:center;">
    <span style="color:#F5F0E6;font-size:20px;font-weight:bold;">{{.StoreName}}</span>
  </td></tr>
  <tr><td style="padding:32px 24px;">

    </table>

    <p style="margin:0;font-size:13px;color:#666;">Use the email and password you registered with to sign in.</p>
  </td></tr>
  <tr><td style="background-color:#F5F0E6;padding:16px 24px;text-align:center;font-size:12px;color:#666;">
    {{.StoreName}} &middot; <a href="{{.StoreURL}}" style="color:#C0271D;">{{.StoreURL}}</a>
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>{{end}}
